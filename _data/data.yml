career-profile:
  title: Career Profile
  summary: |
    Initially trained in Medieval/Reformation History at the University of Wisconsin, I have taught classes in European and World History at a number of schools, including the University of Wisconsin-Oshkosh, the University of Oregon, Oregon State University, and Concordia College.
    After a job teaching on Semester at Sea twenty years ago, I decided to become a librarian and went on to work with rare books and archives at Washington University in St. Louis, James Madison University, and the Woodrow Wilson Presidential Library.
    I have spent the last few years studying for a second PhD in Cultural Studies from George Mason University. My scholarship focuses on the cultural meaning and significance of written heritage collections. My teaching stress the importance of academic special collections to modern education.
